server {
    listen       90;
    
    server_name  180.93.52.88 ;
    index index.html index.htm index.php;
    root  /data/zone/sszg_center_6/www;
    #autoindex on;
    charset utf-8;
    #expires off;
    access_log off;

    location ~.*\.(swf|xml|mp3|png|jpg|gif|data)$ {
        expires       max;
    }
    location ~.*\.(css|js|mx)$ {
        expires       96h;
    }
    location ~ /.svn/ {
        deny all;
    }
    location ~ .php { # 为了支持pathinfo，需将包含.php的URL交给fastcgi解析，同时需设置php.ini中的cgi.fix_pathinfo=1
        expires off;
        #access_log off;
        access_log  /data/logs/s6-center-sszg.52gm.top.log json;

        include fastcgi.conf;
        fastcgi_pass  unix:/tmp/php-cgi-70.sock;
        fastcgi_index index.php;
        fastcgi_param ROOT /data/zone/sszg_center_6; # 这个环境变量需传入，否则web系统无法正常工作
        fastcgi_param PATH_INFO $fastcgi_script_name;
    }
}
