server {
    listen       80;

    server_name  180.93.52.88 hokagedaichien.com;

    index start.html index.html index.htm index.php;
    root  /www/wwwroot/wedsite;
    autoindex off;
    charset utf-8;
    #expires off;
    access_log off;




    location ~.*\.(swf|xml|mp3|png|jpg|gif|data)$ {
        expires       max;
    }
    location ~.*\.(css|js|mx|json|zip)$ {
        add_header Access-Control-Allow-Origin *;
        expires       96h;
    }
    location ~ /.svn/ {
        deny all;
    }
    location ~ /.lua/ {
        default_type  'text/html';
    }
	location / {
                if (!-e $request_filename){
    rewrite ^/([^/]+)$ /user.php?page=$1;
  }
  rewrite ^/([^/]+)/([^/]+)/$ /user.php?page=$1&id=$2;
  rewrite ^/([^/]+)/([^/]+)/([^/]+)/$ /?page=$1&id=$2&ten_sp=$3;
        }


		
		location /sitemap {
		  rewrite ^/sitemap\.xml/?$ /sitemap.php;
		}

		location /page {
		  rewrite ^/page/([^\.]+)$ /index.php?page=$1;
		}
		location /news {
			return 301 $scheme://web.langla.net
;
		}
        location /api {
			try_files $uri $uri $uri/ @extensionless-php;
			}
			location @extensionless-php {
			rewrite ^(.*)$ $1.php last;
			}
    location ~ .php {
        expires off;
        #access_log off;
        access_log  /data/logs/cdntop.log;

        include fastcgi.conf;
        fastcgi_pass  unix:/tmp/php-cgi-70.sock;
        fastcgi_index index.php;
        fastcgi_param ROOT /data/zone/sszg_symlf_1;
        fastcgi_param PATH_INFO $fastcgi_script_name;
    }
}
