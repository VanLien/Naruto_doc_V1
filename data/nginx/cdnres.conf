server {
    listen       85;
    server_name  180.93.52.88;
    root  /data/cdnres;
    index index.html index.htm index.php;
    charset utf-8;
    access_log  /data/logs/cdnres.huanxiang.123gm.top.log ;

    location ~.*\.(swf|xml|mp3|png|jpg|gif|data)$ {
        expires       max;
    }
    location ~.*\.(css|js|mx)$ {
        expires       96h;
    }
    location ~ /.svn/ {
        deny all;
    }
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    location ~ .php {
        expires off;
        access_log  /data/logs/cdnres.huanxiang.123gm.top.log ;
        include fastcgi.conf;
        fastcgi_pass  unix:/tmp/php-cgi-70.sock;
    }
}
